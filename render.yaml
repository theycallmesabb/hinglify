services:
  - type: web
    name: hinglify-extractor
    runtime: docker
    dockerfilePath: ./hinglishpdf/extractor/Dockerfile
    dockerContext: ./hinglishpdf/extractor
    plan: free
    region: oregon

  - type: web
    name: hinglify-backend
    runtime: docker
    dockerfilePath: ./hinglishpdf/backend/Dockerfile
    dockerContext: ./hinglishpdf/backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: hinglify-db
          property: connectionString
      - key: EXTRACTOR_URL
        value: http://hinglify-extractor:8000
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_API_KEY
        sync: false
      - key: API_SECRET_KEY
        value: dev-secret-key
      - key: PORT
        value: 8080

databases:
  - name: hinglify-db
    plan: free
    region: oregon
